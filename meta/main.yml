---
dependencies: []

galaxy_info:
  namespace: realtime
  role_name: rsyslog_client
  author: "Bob Tanner"
  description: >-
    Configures rsyslog as a log-forwarding client, for Ubuntu (jammy,
    noble, resolute), Debian (trixie), and EL (9, 10). Installs
    platform-appropriate packages via apt or dnf, removes legacy
    /etc/rsyslog.d/ configuration fragments left by previous
    deployments, and delegates the rsyslog configuration itself to the
    robertdebock.rsyslog role
    (https://github.com/robertdebock/ansible-role-rsyslog, author Robert
    de Bock). Set rsyslog_receiver: true on hosts that should receive
    logs rather than forward them — client setup is skipped entirely on
    those hosts.
  company: "Real Time Enterprises, Inc."
  license: MIT
  min_ansible_version: "2.20"
  issue_tracker_url: https://github.com/basictheprogram/ansible-role-rsyslog_client/issues
  galaxy_tags:
    - debian
    - el
    - forwarding
    - linux
    - logging
    - redhat
    - rsyslog
    - syslog
    - ubuntu
